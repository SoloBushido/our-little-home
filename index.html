<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6a4bc4"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>
<title>Our Little Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&family=Dancing+Script:wght@600;700&display=swap">
<style>
/* Layout: one tall cutaway dollhouse filling the screen, a bottom sheet for each decorating moment */
:root{
  --ink:#3a2438; --paper:#fff6ea; --paper2:#ffe8d0; --line:#f0d2b4;
  --her:#e0457f; --him:#2f6fcf; --both:#e8960c; --leaf:#3d9970;
  --skyTop:#a9dcff; --skyBot:#fff3d8; --skyMid:#d8eef6;
  --shadow:rgba(58,36,56,.28);
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#2a1a2e;color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{position:relative;height:100%}
#stage{position:absolute;inset:0;background:linear-gradient(var(--skyTop),var(--skyBot));overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

/* top bar */
#top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.pill{pointer-events:auto;background:rgba(255,246,234,.92);border-radius:999px;padding:6px 12px;font-size:14px;box-shadow:0 3px 10px var(--shadow);display:flex;align-items:center;gap:8px;min-width:0}
#brand{font-family:var(--display);font-weight:800;font-size:17px;white-space:nowrap}
#prog{display:flex;gap:3px;align-items:center}
#prog i{width:9px;height:9px;border-radius:50%;background:#e9d6c2;transition:background .4s,transform .4s}
#prog i.on{background:var(--her);transform:scale(1.15)}
#partner{flex:1;justify-content:center;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;text-align:center}
#partner b{color:var(--leaf)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#b9a99a;margin-right:6px;vertical-align:1px}
.dot.live{background:#37c26b;box-shadow:0 0 0 0 rgba(55,194,107,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(55,194,107,0)}100%{box-shadow:0 0 0 0 rgba(55,194,107,0)}}
.ibtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;background:rgba(255,246,234,.92);box-shadow:0 3px 10px var(--shadow);font-size:18px;display:grid;place-items:center}

/* bottom bar */
#bar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:8px;padding:0 12px 12px;flex-wrap:wrap;pointer-events:none;transition:transform .35s,opacity .35s}
#bar.hide{transform:translateY(120%);opacity:0}
.em{pointer-events:auto;min-width:58px;padding:7px 8px 6px;border-radius:18px;background:rgba(255,246,234,.94);box-shadow:0 4px 12px var(--shadow);display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.1;transition:transform .15s}
.em span{font-size:24px;line-height:1.1}
.em:active{transform:scale(.88)}
#finale{pointer-events:auto;display:none;width:100%;max-width:340px;padding:12px 18px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#e8960c,#e0457f);font-family:var(--display);font-size:20px;font-weight:800;box-shadow:0 6px 18px var(--shadow);animation:throb 1.6s infinite}
#finale.show{display:block}
@keyframes throb{50%{transform:scale(1.04)}}

/* scene animation */
.spot{cursor:pointer}
.spot .bub{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spot.quiet .bub{animation:none;opacity:.6}
@keyframes bob{50%{transform:translateY(-3px) scale(1.06)}}
.spot .ring{transform-box:fill-box;transform-origin:center;animation:ringp 2.2s ease-out infinite}
.spot.quiet .ring{display:none}
@keyframes ringp{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.rg{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;transition:transform .4s cubic-bezier(.3,1.7,.5,1),opacity .2s}
.rg.on{transform:scale(1);opacity:1}
.jig{transform-box:fill-box;transform-origin:center;animation:jig .5s ease-in-out infinite alternate}
@keyframes jig{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.twk{animation:twk 1.8s ease-in-out infinite}
@keyframes twk{50%{opacity:.55}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.steam{animation:steam 2.4s ease-in infinite}
@keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-14px);opacity:0}}
.cloud{animation:drift 70s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(560px)}}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq .5s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.pop{transform-box:fill-box;transform-origin:center;animation:popin .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.wig{transform-box:fill-box;transform-origin:center;animation:wig .5s}
@keyframes wig{20%{transform:rotate(-5deg) scale(1.06)}50%{transform:rotate(5deg) scale(1.08)}100%{transform:none}}
.badge{animation:bob 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}


/* life in the house */
.actor{pointer-events:none}
.lg{transform-box:fill-box;transform-origin:50% 0}
.actor.walk .lg.l{animation:stepl .26s ease-in-out infinite alternate}
.actor.walk .lg.r{animation:stepl .26s ease-in-out infinite alternate-reverse}
@keyframes stepl{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
.actor .bodyg{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.8s ease-in-out infinite}
.actor.walk .bodyg{animation:bobw .26s ease-in-out infinite alternate}
.actor.work .bodyg{animation:workb .42s ease-in-out infinite alternate}
.actor.sit .bodyg{animation:none;transform:translateY(7px)}
.actor.sit .legs{display:none}
.actor.jump .bodyg{animation:jmp .65s}
@keyframes breathe{50%{transform:scaleY(1.035)}}
@keyframes bobw{from{transform:translateY(0)}to{transform:translateY(-1.8px)}}
@keyframes workb{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes jmp{30%{transform:translateY(-12px)}65%{transform:translateY(0) scale(1.12,.86)}100%{transform:none}}
.bb{animation:bob 1.4s ease-in-out infinite}
.drop{transform-box:fill-box;transform-origin:50% 100%;animation:dropin .75s cubic-bezier(.3,1.4,.5,1)}
@keyframes dropin{0%{transform:translateY(-36px) scale(1.18,.78);opacity:0}50%{opacity:1}62%{transform:translateY(3px) scale(.95,1.07)}100%{transform:none}}
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:tail 1.8s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.mote{animation:mote 9s ease-in-out infinite}
@keyframes mote{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(8px,-14px);opacity:.75}}
#scene.shake{animation:shake .34s}
@keyframes shake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
#scene.pulse{animation:pulse .55s}
@keyframes pulse{40%{transform:scale(1.025)}}
#vig{position:absolute;inset:0;pointer-events:none;z-index:4;transition:box-shadow 1s}
@media (prefers-reduced-motion:reduce){.actor .bodyg,.bb,.tail,.mote,.drop{animation:none}}


.grab{background:linear-gradient(90deg,var(--her),var(--both),var(--him))!important;opacity:.8}
.card{background:linear-gradient(#fff9ef,#ffe3ee)!important}
#sheet{background:linear-gradient(#fffaf2,#fff0e2)}
.actor.hug .bodyg{animation:hugb 1.7s ease-in-out infinite alternate}
@keyframes hugb{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@media (max-width:480px){#brand{font-size:0;padding:6px 10px}#brand::before{content:"\1F495";font-size:20px}}

/* toast */
#toast{position:absolute;left:50%;top:96px;transform:translate(-50%,-20px);z-index:9;max-width:min(420px,90%);padding:10px 16px;border-radius:16px;background:var(--ink);color:#fff;font-size:15px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* sheet */
#sheet{position:absolute;left:50%;bottom:0;z-index:8;width:min(560px,100%);transform:translate(-50%,108%);background:var(--paper);border-radius:26px 26px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px var(--shadow);transition:transform .5s cubic-bezier(.2,.9,.25,1.08);max-height:62%;overflow:auto}
#sheet.open{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 8px}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;color:#fff;letter-spacing:.04em;text-transform:uppercase}
.chip.her{background:var(--her)}.chip.him{background:var(--him)}.chip.any{background:var(--both)}
.stitle{font-family:var(--display);font-weight:800;font-size:21px;flex:1;line-height:1.1}
#x{width:34px;height:34px;border-radius:50%;background:var(--paper2);font-size:16px}
.say{font-size:17px;margin:6px 0 12px;min-height:24px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ch{padding:12px 6px;border-radius:18px;background:#fff;border:2.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;line-height:1.15;text-align:center;transition:transform .15s,border-color .15s,background .15s;box-shadow:0 3px 0 var(--line)}
.ch b{font-size:30px;line-height:1.15;font-weight:400}
.ch small{font-weight:700;font-size:12px;opacity:.65}
.ch:active{transform:translateY(3px);box-shadow:none}
.ch.pick{border-color:var(--both);background:#fff3d0;transform:scale(1.04)}
.actwrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 0 4px}
.big{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--c,var(--both)) calc(var(--p,0)*1%),#efdcc7 0);touch-action:none;transition:transform .12s}
.big::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.07)}
.big span{position:relative;font-size:44px}
.big.down{transform:scale(.93)}
.hint{font-size:15px;opacity:.8;text-align:center}
.ok{margin-top:6px;width:100%;padding:13px;border-radius:18px;background:var(--both);color:#fff;font-family:var(--display);font-size:20px;font-weight:800;box-shadow:0 4px 0 #b5720a}
.ok:active{transform:translateY(3px);box-shadow:none}
.notes{display:flex;flex-direction:column;gap:8px;max-height:150px;overflow:auto;margin-bottom:10px}
.note{padding:8px 12px;border-radius:12px;font-size:15px;text-align:left}
.note.her{background:#ffd5e5}.note.him{background:#d3e4ff}
.note small{display:block;opacity:.6;font-size:11px}
input.txt{width:100%;padding:11px 14px;border-radius:14px;border:2.5px solid var(--line);font:inherit;font-weight:700;background:#fff;color:var(--ink)}

/* overlays */
.ov{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(42,26,46,.78);overflow:auto}
.ov.show{display:flex}
.card{width:min(440px,100%);background:var(--paper);border-radius:28px;padding:24px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:popin .6s cubic-bezier(.3,1.5,.5,1)}
.card h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:2px 0 8px}
.card p{margin:0 0 14px;font-size:16px;line-height:1.35}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.role{padding:16px 8px;border-radius:22px;color:#fff;font-family:var(--display);font-size:22px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;transition:transform .15s}
.role small{font-family:var(--body);font-weight:700;font-size:12px;opacity:.9;margin-top:2px}
.role span{font-size:40px}
.role:active{transform:translateY(4px);box-shadow:none}
.role.her{background:var(--her)}.role.him{background:var(--him)}
.link{margin-top:10px;font-size:14px;text-decoration:underline;opacity:.7}
.stat{display:flex;justify-content:space-between;padding:8px 14px;border-radius:14px;background:#fff;margin:6px 0;font-size:16px}
@media (prefers-reduced-motion:reduce){.spot .bub,.spot .ring,.cloud,.badge,.sway,.jig,.eq,.twk,#finale{animation:none}}

/* v4: romantic storybook look */
:root{--script:'Dancing Script','Brush Script MT','Segoe Script',cursive}
#brand{font-family:var(--script);font-weight:700;font-size:23px;color:#c2336f;text-shadow:0 1px 0 #fff}
.stitle{font-family:var(--script);font-size:27px;font-weight:700;color:#8a2a5c}
.card h1{font-family:var(--script);font-size:50px;font-weight:700;color:#c2336f;line-height:.95}
.say{font-family:var(--script);font-size:22px;font-weight:600;line-height:1.15}
.pill,.ibtn,.em{background:rgba(255,244,248,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.75)}
#prog i{width:auto;height:auto;border-radius:0;background:none!important;font-style:normal;font-size:11px;line-height:1;color:#ecd5c8;transform:none}
#prog i::before{content:"\2665"}
#prog i.on{color:var(--her);transform:scale(1.25);text-shadow:0 0 6px rgba(255,90,150,.6)}
#toast{background:linear-gradient(135deg,#6b2f66,#b0407f);box-shadow:0 8px 24px rgba(107,47,102,.4);font-family:var(--body)}
#sheet{background:linear-gradient(#fffaf5,#ffeaf1);border-top:3px solid #ffc2da}
.ok{background:linear-gradient(135deg,#ff7aa8,#e8960c);box-shadow:0 4px 0 #b84a74}
.ch{border-color:#ffd6e4;box-shadow:0 3px 0 #ffd0e0}
#welcome{background:radial-gradient(circle at 50% 22%,rgba(255,150,195,.62),rgba(58,22,72,.93))}
.fh{position:absolute;bottom:-40px;color:#ffb3d1;opacity:0;animation:rise 9s linear infinite;pointer-events:none}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.85}100%{transform:translateY(-115vh) scale(1.3) rotate(25deg);opacity:0}}
.beat2{transform-box:fill-box;transform-origin:center;animation:beatk 1.4s ease-in-out infinite}
.beat{transform-box:fill-box;transform-origin:center;animation:beatk 1.2s ease-in-out infinite}
@keyframes beatk{0%,100%{transform:scale(1)}20%{transform:scale(1.2)}40%{transform:scale(1)}60%{transform:scale(1.12)}}
.petal{transform-box:fill-box;transform-origin:center;opacity:0;animation:petal 12s linear infinite}
@keyframes petal{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:.9}50%{transform:translate(calc(var(--dx)*.5),calc(var(--dy)*.6)) rotate(260deg)}100%{transform:translate(var(--dx),var(--dy)) rotate(560deg);opacity:0}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
#halo{transition:opacity .9s}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 38%,rgba(255,226,180,.3),transparent 64%),linear-gradient(180deg,rgba(255,160,200,.15),rgba(255,210,150,.1));mix-blend-mode:soft-light}
.bk{position:absolute;border-radius:50%;pointer-events:none;z-index:3;mix-blend-mode:screen;filter:blur(1.5px);opacity:0;animation:bkf 16s ease-in-out infinite}
@keyframes bkf{0%,100%{transform:translate(0,0);opacity:0}30%{opacity:.6}60%{transform:translate(14px,-40px);opacity:.35}}
@media (prefers-reduced-motion:reduce){.petal,.flame,.beat,.beat2,.bk,.fh{animation:none}.fh{display:none}}

/* v6: cleaning stage and closeness */
#scene.scrubmode{touch-action:none;cursor:grab}
#clouds{pointer-events:none}
#cleanbar{position:absolute;left:0;right:0;bottom:0;z-index:7;padding:30px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(58,22,72,.5) 45%);transform:translateY(115%);transition:transform .5s cubic-bezier(.2,.9,.25,1.05);pointer-events:none}
#cleanbar.show{transform:none}
.cbcard{pointer-events:auto;max-width:520px;margin:0 auto;background:rgba(255,244,248,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:22px;padding:10px 12px 8px;box-shadow:0 8px 28px var(--shadow)}
.cbrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--script);font-size:20px;font-weight:600;color:#8a2a5c}
.cbrow b{font-family:var(--display);font-size:16px;color:#e0457f}
.cbtrack{height:8px;border-radius:99px;background:#f3dbe6;overflow:hidden;margin:6px 0 8px}
.cbtrack i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7fd6f5,#ff9ecb,#ffd36b);transition:width .3s}
#cbz{display:flex;gap:6px}
.zc{flex:1;min-width:0;padding:6px 2px;border-radius:14px;background:#fff;border:2px solid #ffd6e4;display:flex;flex-direction:column;align-items:center;font-size:10.5px;line-height:1.15;gap:1px}
.zc b{font-size:19px;font-weight:400}.zc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.zc small{font-weight:800;opacity:.7}
.zc.on{border-color:#e0457f;background:#ffeaf2}.zc.ok{background:#e6fbe9;border-color:#7cd69a}
#banner{position:absolute;inset:0;z-index:9;display:grid;place-content:center;pointer-events:none;opacity:0;transition:opacity .7s;text-align:center;color:#fff;font-family:var(--script);font-size:56px;font-weight:700;line-height:1;text-shadow:0 3px 20px rgba(120,30,90,.75)}
#banner.show{opacity:1}#banner small{display:block;font-size:26px;margin-top:8px;font-weight:600}
.em.hold{transform:scale(.92);background:#ffd1e3;box-shadow:0 0 0 4px rgba(255,90,150,.35)}
.em.call{animation:throb 1s infinite;background:#ffe3ef}
#hhb{touch-action:none;-webkit-touch-callout:none}
.actor.dance .bodyg{animation:dnc 1.6s ease-in-out infinite alternate}
@keyframes dnc{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-3px)}}
.lbob{animation:lbob 5s ease-in-out infinite alternate}
@keyframes lbob{from{transform:translateY(-3px)}to{transform:translateY(4px)}}
.lrise{animation:lrise 4s cubic-bezier(.2,.7,.3,1)}
@keyframes lrise{0%{transform:translateY(180px) scale(.5);opacity:0}15%{opacity:1}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.lbob,.lrise,.actor.dance .bodyg{animation:none}}

/* v7: crackers */
.fz{transform-box:fill-box;transform-origin:center;animation:fzk .14s infinite alternate}
@keyframes fzk{from{transform:scale(.7)}to{transform:scale(1.4)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spinr .3s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.soot{display:none}.actor.sooty .soot{display:inline}
#stage{transition:filter .15s}#stage.flash{filter:brightness(1.7)}
#sparkbar{position:absolute;left:0;right:0;bottom:0;z-index:7;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;transform:translateY(120%);transition:transform .4s;pointer-events:none}
#sparkbar.show{transform:none}#sparkbar button{pointer-events:auto;width:auto;padding:12px 30px}
@media (prefers-reduced-motion:reduce){.fz,.spin{animation:none}}

/* v8: game feel */
#beatglow{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(circle at 50% 75%,rgba(255,200,130,.42),rgba(255,120,180,.16) 45%,transparent 70%);mix-blend-mode:screen}
@keyframes bgp{0%{opacity:.6}100%{opacity:0}}
#prog i.new{animation:hpop .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes hpop{0%{transform:scale(.2)}60%{transform:scale(2)}100%{transform:scale(1.25)}}
.ch,.ok,.em,.zc,.ibtn,.role{transition:transform .13s cubic-bezier(.3,1.7,.5,1),box-shadow .13s,background .15s}
.ok:active,.zc:active,.ibtn:active{transform:scale(.93)}
.ch.pick{animation:pk .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes pk{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){#beatglow{display:none}}
</style>

<div id="app">
  <div id="stage">

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* Standalone sync for Our Little Home: a private room code, direct phone-to-phone link for live moments, and a short relay for saved progress. */
(function(){
'use strict';
const lsG=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const NTFY='https://ntfy.sh/';
const rid=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
const pid=rid(8);
let code=(location.hash.replace(/^#/,'').trim()||lsG('olh-room')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
let readyRes;const ready=new Promise(r=>readyRes=r);
const clone=o=>JSON.parse(JSON.stringify(o));
const orStr=(a,b)=>{const n=Math.max(a.length,b.length);let o='';for(let i=0;i<n;i++)o+=(a[i]==='1'||b[i]==='1')?'1':'0';return o};
function merge(t,s,path){path=path||'';for(const k in s){const v=s[k];if(v&&typeof v==='object'&&!Array.isArray(v)){if(!t[k]||typeof t[k]!=='object')t[k]={};merge(t[k],v,path+k+'.')}else if(path==='clean.'&&typeof v==='string'&&typeof t[k]==='string')t[k]=orStr(t[k],v);else t[k]=v}return t}

let doc={},pending={},flushT=0,snapCbs=[],snapT=0,peerCbs=[];
const handlers={};let myPres={},remote=null,conn=null,peer=null,peerOpen=false,lastSeen=0;
const seenM=new Set();
const topic=()=>'olh-'+code;

/* ---- relay (ntfy): saved progress, hellos, fallback messages ---- */
let postQ=Promise.resolve();
const post=m=>{postQ=postQ.then(()=>fetch(NTFY+topic(),{method:'POST',body:JSON.stringify(m)}).catch(()=>{})).then(()=>new Promise(r=>setTimeout(r,1100)))};
const wrap=(path,v)=>path.reduceRight((a,k)=>({[k]:a}),v);
function chunks(o,path){path=path||[];const s=JSON.stringify(o);if(s.length<3000||!o||typeof o!=='object')return [wrap(path,o)];return Object.keys(o).flatMap(k=>chunks(o[k],path.concat(k)))}
function flush(){clearTimeout(flushT);flushT=0;if(!Object.keys(pending).length)return;const p=pending;pending={};lsS('olh-pend-'+code,'{}');chunks(p).forEach(c=>post({t:'patch',pid,patch:c}))}
function beacon(){if(!Object.keys(pending).length)return;const p=pending;pending={};try{chunks(p).forEach(c=>navigator.sendBeacon(NTFY+topic(),JSON.stringify({t:'patch',pid,patch:c})))}catch(e){}}
addEventListener('pagehide',beacon);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')beacon()});

/* ---- doc ---- */
const save=()=>lsS('olh-doc-'+code,JSON.stringify(doc));
const snapshot=()=>({exists:Object.keys(doc).length>0,data:()=>clone(doc)});
const fire=()=>{clearTimeout(snapT);snapT=setTimeout(()=>{const s=snapshot();snapCbs.forEach(f=>{try{f(s)}catch(e){console.error(e)}})},40)};
function applyPatch(p,remoteChange){merge(doc,p);save();if(remoteChange)fire()}
function queue(p){merge(pending,p);lsS('olh-pend-'+code,JSON.stringify(pending));if(conn&&conn.open)try{conn.send({t:'patch',pid,patch:p})}catch(e){}if(!flushT)flushT=setTimeout(flush,6000)}
const DOC={get:async()=>snapshot(),set:async o=>{applyPatch(o,false);queue(o)},update:async p=>{applyPatch(p,false);queue(p)},onSnapshot:cb=>{snapCbs.push(cb);setTimeout(()=>cb(snapshot()),0);return()=>{}}};
const DB={doc:()=>DOC};

/* ---- room ---- */
const dispatch=(t,d)=>(handlers[t]||[]).forEach(f=>{try{f({data:d,isMe:false,sameTab:false})}catch(e){console.error(e)}});
const firePeers=()=>peerCbs.forEach(f=>{try{f()}catch(e){}});
const ROOM={
  emit:async(t,d)=>{const m={t:'emit',topic:t,data:d,pid,mid:rid(8)};if(conn&&conn.open)try{conn.send(m)}catch(e){}else if(t!=='brush')post(m)},
  on:(t,fn)=>{(handlers[t]=handlers[t]||[]).push(fn);return()=>{}},
  presence:async p=>{myPres=p;if(conn&&conn.open)try{conn.send({t:'pres',pid,p})}catch(e){}},
  onPeers:fn=>{peerCbs.push(fn);return()=>{}},
  peers:()=>[{peer:pid,isMe:true,presence:myPres}].concat(remote?[{peer:remote.pid,isMe:false,presence:remote.presence}]:[])
};

function onMsg(m,age){if(!m||m.pid===pid)return;
  if(m.mid){if(seenM.has(m.mid))return;seenM.add(m.mid)}
  switch(m.t){
    case 'patch':if(m.patch)applyPatch(m.patch,true);break;
    case 'full':if(m.doc)applyPatch(m.doc,true);break;
    case 'hello':if(age<45)onHello(m);break;
    case 'emit':if(age<20)dispatch(m.topic,m.data);break;
    case 'pres':remote={pid:m.pid,presence:m.p};lastSeen=Date.now();firePeers();break}}
function hello(){post({t:'hello',pid,mid:rid(6)})}
function onHello(m){if(!peer||!peerOpen||(conn&&conn.open))return;if(pid<m.pid)connectTo(m.pid);else hello()}
function startPeer(){if(!window.Peer)return;try{peer=new Peer('olh-'+code+'-'+pid)}catch(e){return}
  peer.on('open',()=>{peerOpen=true;hello()});
  peer.on('connection',c=>adopt(c));
  peer.on('error',()=>{})}
function connectTo(pp){if(conn&&conn.open)return;try{adopt(peer.connect('olh-'+code+'-'+pp,{reliable:true}))}catch(e){}}
function adopt(c){if(conn&&conn.open&&conn!==c){try{c.close()}catch(e){}return}conn=c;
  c.on('open',()=>{lastSeen=Date.now();try{c.send({t:'full',pid,doc:clone(doc)});c.send({t:'pres',pid,p:myPres})}catch(e){}});
  c.on('data',d=>{lastSeen=Date.now();onMsg(d,0)});
  c.on('close',()=>lost(c));c.on('error',()=>lost(c))}
function lost(c){if(conn!==c)return;conn=null;remote=null;firePeers();setTimeout(hello,2500)}
setInterval(()=>{if(conn&&conn.open){try{conn.send({t:'pres',pid,p:myPres})}catch(e){}if(Date.now()-lastSeen>17000){try{conn.close()}catch(e){}lost(conn)}}else if(peerOpen)hello()},9000);

function subscribe(){try{const es=new EventSource(NTFY+topic()+'/sse?since=all');
  es.onmessage=e=>{let o;try{o=JSON.parse(e.data)}catch(_){return}if(o.event!=='message')return;let m;try{m=JSON.parse(o.message)}catch(_){return}onMsg(m,Math.max(0,Date.now()/1000-(o.time||0)))}}catch(e){}}

function begin(){
  lsS('olh-room',code);try{history.replaceState(null,'','#'+code)}catch(e){}
  try{doc=JSON.parse(lsG('olh-doc-'+code)||'{}')}catch(e){doc={}}
  try{pending=JSON.parse(lsG('olh-pend-'+code)||'{}')}catch(e){pending={}}
  flush();subscribe();startPeer();
  const info=document.createElement('p');info.id='roominfo';info.style.cssText='font-size:13px;margin:10px 0 0';
  info.innerHTML='Your room code: <b>'+code.toUpperCase()+'</b> · <a href="#" id="cplink" style="color:#c2336f;font-weight:800">Copy invite link</a>';
  const card=document.querySelector('#welcome .card');if(card)card.appendChild(info);
  info.querySelector('#cplink').onclick=e=>{e.preventDefault();const u=location.origin+location.pathname+'#'+code;try{navigator.clipboard.writeText(u).then(()=>{e.target.textContent='Copied!'})}catch(_){prompt('Send this link to your partner:',u)}};
  readyRes()}

/* ---- room screen ---- */
function roomScreen(){
  const ov=document.createElement('div');ov.className='ov show';ov.style.cssText='position:fixed;z-index:50';
  ov.innerHTML='<div class="card"><svg width="110" height="84" viewBox="-34 -26 68 52" style="overflow:visible"><g class="beat2"><use href="#hrt" x="-26" y="-20" width="34" height="34" fill="#e0457f" stroke="#fff" stroke-width="1.6"/><use href="#hrt" x="-6" y="-14" width="34" height="34" fill="#2f6fcf" stroke="#fff" stroke-width="1.6"/></g></svg><h1>Our Little Home</h1><p>One of you makes a room and sends the link. The other just opens it. Same room, same house.</p><button class="ok" id="mk">Make our room</button><p style="margin:12px 0 6px;font-size:14px">Already have a code or link?</p><input class="txt" id="jn" placeholder="Paste it here" autocomplete="off"><button class="ok" id="jb" style="margin-top:8px;background:linear-gradient(135deg,#7aa8ff,#2f6fcf);box-shadow:0 4px 0 #1f4a94">Join</button></div>';
  document.body.appendChild(ov);
  const go=c=>{code=c;ov.remove();begin()};
  ov.querySelector('#mk').onclick=()=>go('diya-'+rid(8));
  ov.querySelector('#jb').onclick=()=>{let v=ov.querySelector('#jn').value.trim();if(v.includes('#'))v=v.split('#').pop();v=v.toLowerCase().replace(/[^a-z0-9-]/g,'');if(v.length<6)return;go(v)}}

window.claude={use:async n=>{await ready;return n==='db'?DB:n==='room'?ROOM:null}};
if(code.length>=6)begin();else roomScreen();
})();

</script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- tiny helpers ---------- */
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hex2=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hex2(a),B=hex2(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const shade=(h,t)=>t<0?mix(h,'#000000',-t):mix(h,'#ffffff',t);
const heart=(x,y,s,f)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 6C-12-4-8-12 0-6 8-12 12-4 0 6Z" fill="${f}"/>`;
const ROLE={her:{lab:'Her',em:'🌸',col:'#e0457f'},him:{lab:'Him',em:'🔧',col:'#2f6fcf'}};
const other=r=>r==='her'?'him':'her';

/* ---------- state ---------- */
let me=lsGet('olh-role')||null;           // her | him | both
let myName=lsGet('olh-name')||'';
let state={v:1,tasks:{},notes:{},names:{},finale:null};
let live={};                                // in-progress visuals, per task
let current=null;                           // task id open in the sheet
let db=null,docRef=null,room=null,writeQ=Promise.resolve(),netMode='local';
const seen=new Set();let initialised=false;
const nameOf=r=>(state.names&&state.names[r])||ROLE[r].lab;
const rec=id=>state.tasks[id]||{};
function deepMerge(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])){t[k]=t[k]&&typeof t[k]==='object'?t[k]:{};deepMerge(t[k],s[k])}else t[k]=s[k]}return t}

/* ---------- audio: soft synth sounds, no files ---------- */
let AC=null,soundOn=lsGet('olh-snd')!=='0';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.15,type='sine',g=.12,to=null,at=0){if(!soundOn)return;const c=ac();if(!c)return;const t=c.currentTime+at,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(v).connect(c.destination);o.start(t);o.stop(t+d+.02)}
function noise(d=.2,g=.1,f=1200,at=0){if(!soundOn)return;const c=ac();if(!c)return;const t=c.currentTime+at,n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;const v=c.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(fl).connect(v).connect(c.destination);s.start(t)}
const PENT=[523,587,659,784,880,988,1175];
const sfx={
  pop(){tone(480,.09,'sine',.14,900)},
  tap(){tone(260,.07,'triangle',.16,180)},
  tick(i=0){tone(PENT[i%PENT.length]*(1+Math.random()*.01),.12,'sine',.07)},
  thud(){tone(130,.2,'sine',.3,45);noise(.08,.12,400);shake()},
  swish(){noise(.35,.1,2200)},
  water(){for(let i=0;i<4;i++)tone(rnd(500,900),.06,'sine',.05,rnd(900,1400),i*.05)},
  chime(){[0,2,4,5].forEach((n,i)=>tone(PENT[n],.5,'sine',.1,null,i*.09))},
  tada(){[0,2,4,6].forEach((n,i)=>tone(PENT[n]/ (i>2?1:1),.7,'triangle',.1,null,i*.11))},
  snap(){tone(900,.04,'square',.07,300);noise(.05,.1,3000)},
  boom(){noise(.5,.18,500);tone(90,.4,'sine',.2,40)},
  love(){tone(660,.2,'sine',.12,990);tone(880,.3,'sine',.1,1320,.12)},
  lightup(i=0){tone(700+i*45,.18,'sine',.06)}
};
const buzz=(n=10)=>{try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(n)}catch(e){}};

/* ---------- particles on a canvas above the scene ---------- */
const fxc=$('#fx'),fctx=fxc.getContext('2d');let parts=[],fxRun=false,DPR=1;
function sizeFx(){const r=$('#stage').getBoundingClientRect();DPR=Math.min(2,devicePixelRatio||1);fxc.width=r.width*DPR;fxc.height=r.height*DPR}
function svgToScreen(x,y){const s=$('#scene'),p=s.createSVGPoint();p.x=x;p.y=y;const m=s.getScreenCTM();const q=p.matrixTransform(m);const r=$('#stage').getBoundingClientRect();return [q.x-r.left,q.y-r.top]}
function burst(x,y,o={}){const [sx,sy]=o.screen?[x,y]:svgToScreen(x,y);const n=reduce?Math.ceil((o.n||14)/3):(o.n||14),cols=o.colors||['#ffd36b','#ff8fb5','#fff'];
  for(let i=0;i<n;i++){const a=o.up?rnd(-Math.PI*.9,-Math.PI*.1):rnd(0,Math.PI*2),sp=rnd(1.5,(o.sp||5));parts.push({x:sx,y:sy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:o.g??.12,life:0,max:rnd(40,80)*(o.long?1.6:1),s:rnd(2.5,6)*(o.size||1),c:pick(cols),shape:o.shape||'dot',em:o.em,r:rnd(0,6),vr:rnd(-.2,.2)})}
  if(!fxRun){fxRun=true;requestAnimationFrame(fxLoop)}}
function floatEmoji(em,n=8,fromX,fromY){const r=$('#stage').getBoundingClientRect();for(let i=0;i<n;i++){parts.push({x:(fromX??r.width/2)+rnd(-40,40),y:(fromY??r.height-60)+rnd(-10,10),vx:rnd(-.8,.8),vy:rnd(-3.2,-1.6),g:-.01,life:-i*4,max:rnd(90,140),s:rnd(22,38),shape:'em',em,r:0,vr:rnd(-.02,.02),c:'#000'})}
  if(!fxRun){fxRun=true;requestAnimationFrame(fxLoop)}}
function fxLoop(){fctx.setTransform(DPR,0,0,DPR,0,0);fctx.clearRect(0,0,fxc.width,fxc.height);
  parts=parts.filter(p=>{p.life++;if(p.life<0)return true;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;const t=p.life/p.max;if(t>=1)return false;fctx.globalAlpha=t<.7?1:1-(t-.7)/.3;
    if(p.shape==='em'){fctx.font=`${p.s}px serif`;fctx.textAlign='center';fctx.fillText(p.em,p.x,p.y)}
    else if(p.shape==='txt'){fctx.font='800 17px "Baloo 2",Nunito,sans-serif';fctx.textAlign='center';fctx.lineWidth=4;fctx.lineJoin='round';fctx.strokeStyle='#3a2438';fctx.strokeText(p.em,p.x,p.y);fctx.fillStyle=p.c;fctx.fillText(p.em,p.x,p.y)}
    else{fctx.fillStyle=p.c;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);
      if(p.shape==='heart'){fctx.beginPath();const s=p.s/6;fctx.moveTo(0,6*s);fctx.bezierCurveTo(-12*s,-4*s,-8*s,-12*s,0,-6*s);fctx.bezierCurveTo(8*s,-12*s,12*s,-4*s,0,6*s);fctx.fill()}
      else if(p.shape==='bub'){fctx.strokeStyle='rgba(255,255,255,.95)';fctx.fillStyle='rgba(190,230,255,.35)';fctx.lineWidth=1.2;fctx.beginPath();fctx.arc(0,0,p.s,0,7);fctx.fill();fctx.stroke();fctx.fillStyle='#fff';fctx.beginPath();fctx.arc(-p.s*.3,-p.s*.3,p.s*.25,0,7);fctx.fill()}
      else if(p.shape==='rect'){fctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6)}
      else{fctx.beginPath();fctx.arc(0,0,p.s/2,0,7);fctx.fill()}
      fctx.restore()}
    return true});
  fctx.globalAlpha=1;if(parts.length)requestAnimationFrame(fxLoop);else{fxRun=false;fctx.clearRect(0,0,fxc.width,fxc.height)}}
const confetti=(x,y)=>burst(x,y,{n:50,sp:7,up:true,shape:'rect',colors:['#e0457f','#e8960c','#2f6fcf','#3d9970','#ffd36b','#fff'],g:.16,long:true});

/* ---------- toast ---------- */
let toastT;function toast(t,ms=3000){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),ms)}

/* ---------- the scene ---------- */

function stepStatus(id){const t=TASKS[id],r=rec(id);const k=t.steps.findIndex((_,i)=>!r['s'+i]);if(k<0)return{done:true};
  const w=t.steps[k].who;let role=w;if(w==='any')role='any';else if(w==='other')role=r.s0?other(r.s0.by):'any';
  const mine=me==='both'||role==='any'||role===me;return{k,role,mine,waiting:k>0}}
function renderSpots(){
  const g=$('#spots');let h='';

  if(!isCleaned()){g.innerHTML=spotSvg('scrub',{em:'🧼',lab:'Clean',x:200,y:330},{role:'any',mine:true});return}

}

  if(!me){$('#welcome').classList.add('show');return}

    else if(id==='chai'){const r=rec('chai'),a=r.s0.o.a,b=r.s1.o.b;toast(a===b?`Both picked ${CHAI[a][0]}. Great minds.`:`${CHAI[a][0]} and ${CHAI[b][0]}. A little of both.`)}

/* ---------- the bottom sheet and its helpers ---------- */
const sheetEl=$('#sheet'),sbody=$('#sbody');
const CANCEL={cancel:true};
let pend=null;
const S={
  say(t){$('#say').textContent=t},
  clear(){sbody.innerHTML='';sbody.onclick=null},
  wait(fn){return new Promise((res,rej)=>{pend={rej};fn(res)})},
  choose(prompt,opts,cols){S.say(prompt);S.clear();return S.wait(res=>{const w=document.createElement('div');w.className='choices'+(cols===3||opts.length===3||opts.length===5?' c3':'');w.innerHTML=opts.map(o=>`<button class="ch" data-k="${o.k}"><b>${o.em}</b>${o.t}</button>`).join('');
    w.onclick=e=>{const b=e.target.closest('.ch');if(!b)return;b.classList.add('pick');sfx.pop();buzz(8);w.onclick=null;setTimeout(()=>res(b.dataset.k),260)};sbody.appendChild(w)})},
  hold(label,ms,cb,o={}){S.say(label);S.clear();return S.wait(res=>{const w=document.createElement('div');w.className='actwrap';w.innerHTML=`<button class="big" style="--c:${o.color||'#e8960c'};--p:0"><span>${o.em||'👆'}</span></button><div class="hint">Press and hold</div>`;sbody.appendChild(w);
    const b=w.firstChild,hint=w.lastChild;let p=0,down=false,last=0,tickAt=0,fin=false;
    const iv=setInterval(()=>loop(performance.now()),16);const loop=t=>{if(fin||!sheetEl.classList.contains('open')){clearInterval(iv);return}if(down){const dt=Math.min(50,t-last);p=clamp(p+dt/ms,0,1);b.style.setProperty('--p',(p*100).toFixed(1));cb(p);if(p>=tickAt){tickAt+=.045;sfx.tick(Math.floor(p*30))}if(p>=1){fin=true;b.classList.remove('down');sfx.tada();buzz([20,40,20]);clearInterval(iv);return res(true)}}last=t};
    const on=e=>{e.preventDefault();ac();down=true;last=performance.now();b.classList.add('down');hint.textContent='Keep going…'};
    const off=()=>{down=false;b.classList.remove('down');if(p<1)hint.textContent='Keep holding to finish'};
    b.addEventListener('pointerdown',on);addEventListener('pointerup',off);addEventListener('pointercancel',off);
    b.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')on(e)});b.addEventListener('keyup',off);
    })},
  taps(label,n,cb,o={}){S.say(label);S.clear();return S.wait(res=>{const w=document.createElement('div');w.className='actwrap';w.innerHTML=`<button class="big" style="--c:#e8960c;--p:0"><span>${o.em||'👆'}</span></button><div class="hint">${n>1?`Tap! 0 of ${n}`:'Tap!'}</div>`;sbody.appendChild(w);const b=w.firstChild,hint=w.lastChild;let i=0,busy=false;
    b.onclick=async()=>{if(busy)return;busy=true;ac();b.classList.add('down');setTimeout(()=>b.classList.remove('down'),90);buzz(14);const k=i++;b.style.setProperty('--p',(i/n*100).toFixed(0));hint.textContent=n>1?`Tap! ${i} of ${n}`:'';sfx.tap();await cb(k);if(i>=n){b.onclick=null;setTimeout(()=>res(true),i>0?300:0);sfx.pop()}busy=false}})},
  done(msg){S.say(msg);S.clear();return S.wait(res=>{const b=document.createElement('button');b.className='ok';b.textContent='Lovely 💗';b.onclick=()=>{sfx.pop();res(true)};sbody.appendChild(b)})}
};
function openSheet(chipRole,title){const c=$('#schip');c.className='chip '+chipRole;c.textContent=chipRole==='her'?nameOf('her'):chipRole==='him'?nameOf('him'):'Together';$('#stitle').textContent=title;sheetEl.classList.add('open');$('#bar').classList.add('hide')}
function closeSheet(){sheetEl.classList.remove('open');$('#bar').classList.remove('hide');if(pend){const p=pend;pend=null;p.rej(CANCEL)}current=null;actorStop();setPresence();goHome()}

async function openTask(id,k){
  const t=TASKS[id],step=t.steps[k];current=id;
  const r=rec(id),role=step.who==='other'?(r.s0?other(r.s0.by):'any'):step.who;
  const arole=me==='both'?(step.who==='other'?other(r.s0.by):step.who==='any'?'her':step.who):me;actorStart(arole,id);
  setPresence();camTo(spotCam(t.cam),900);S.clear();
  openSheet(role==='both'?'any':role,t.name);
  let opts;
  try{opts=await step.run()}catch(e){delete live[id];drawTask(id);if(e!==CANCEL)console.error(e);return}
  const by=me==='both'?(step.who==='other'?other(r.s0.by):step.who==='any'?'her':step.who):me;
  delete live[id];
  commit({tasks:{[id]:{['s'+k]:{by,o:opts,t:Date.now()}}}});
  seen.add(id+':'+k);
  bounceGroup(id);shake();pulseScene();floatText(t.x,t.y-26,'+1 moment','#ffd36b');actorEmote(arole,'💗');
  sfx.chime();buzz([30,50,30]);burst(t.x,t.y,{n:30,sp:6,up:true,colors:['#ffd36b','#ff8fb5','#fff','#9ee0ff'],g:.1});
  const complete=!stepStatus(id).waiting&&stepStatus(id).done;
  if(complete){setTimeout(()=>confetti(t.x,t.y),200)}
  let msg=story(id,k)||step.done;
  if(false&&id==='chai'&&k===1){const a=r.s0.o.a;msg=a===opts.b?`You both reached for ${CHAI[a][0]}. Great minds.`:`${CHAI[a][0]} and ${CHAI[opts.b][0]}, one pot, two cups. A little of both.`}
  if(!complete&&stepStatus(id).role&&!stepStatus(id).done){const nx=stepStatus(id).role;msg=(msg||'')+(nx!=='any'&&nx!==me?` Over to ${nameOf(nx)} next.`:'')}
  tweenSky(targetSky(),1800);
  try{await S.done(msg||'Done.')}catch(e){if(e===CANCEL)return}
  const wasCurrent=current===id;pend=null;
  if(wasCurrent)closeSheet();
  if(allDone()&&!state.finale)toast('Everything is ready. Light up your home!',4500);
}

  el.querySelector('.pos').setAttribute('transform',`translate(${a.x.toFixed(1)} ${a.y.toFixed(1)})`);
  el.querySelector('.sc').setAttribute('transform',`scale(${(1.45*a.face).toFixed(2)} 1.45)`);
  el.setAttribute('class','actor'+(a.walk?' walk':'')+(a.work&&!a.walk?' work':'')+(a.sit&&!a.walk?' sit':'')+(a.jump?' jump':'')+(a.hug&&!a.walk?' hug':'')+(dancing&&!a.walk?' dance':'')+(a.soot?' sooty':''));
  const em=a.bt>0?a.bub:(a.work&&!a.walk&&a.task?(a.task==='notes'?'\u{1F48C}':TASKS[a.task].em):null),bb=el.querySelector('.bb');
  bb.style.display=em?'':'none';if(em)bb.querySelector('text').textContent=em;
  el.querySelector('.nmt').textContent=nameOf(r)+(a.online?'':' · away')}haloUpdate()}
function tickActors(dt){let ch=false;for(const r in actors){const a=actors[r];
  if(a.bt>0){a.bt-=dt;ch=true}
  if(a.q.length){const w=a.q[0],dx=w[0]-a.x,dy=w[1]-a.y,d=Math.hypot(dx,dy);if(d<.8){a.x=w[0];a.y=w[1];a.q.shift()}else{const st=Math.min(d,125*dt);a.x+=dx/d*st;a.y+=dy/d*st;if(Math.abs(dx)>.6)a.face=dx>0?1:-1;a.walk=true}ch=true}
  else if(a.walk){a.walk=false;onArrive(a,r);ch=true}}
  hugT+=dt;if(hugT>3){hugT=0;const A=actors.her,B=actors.him;if(!A.walk&&!B.walk&&A.online&&B.online&&((A.hug&&B.hug)||(A.sit&&B.sit))){burst((A.x+B.x)/2,A.y-52,{n:3,shape:'heart',colors:['#ff7eb6','#e0457f','#ffb3d1'],up:true,sp:2.2,g:-.01,long:true});tone(PENT[Math.floor(rnd(0,5))]/2,.5,'sine',.04)}}
  if(ch)renderActors()}

  const C=[['anar','⛲','Anar'],['chakri','🌀','Chakri'],['rocket','🚀','Heart rocket'],['sutli','🧨','Sutli bomb'],['spark','🎇','Sparkler'],['prank','😈','Prank bomb']];
  sbody.innerHTML=`<div class="choices c3">${C.map(([k,e,t])=>`<button class="ch" data-k="${k}"><b>${e}</b>${t}</button>`).join('')}</div><div class="hint" style="margin-top:8px;font-size:13px">Prank bomb plants a lit sutli at your partner's feet. They have 2 seconds to defuse it.</div>`;
  sbody.onclick=e=>{const b=e.target.closest('.ch');if(!b)return;sfx.pop();buzz(8);const k=b.dataset.k;closeSheet();setTimeout(()=>fire(k),400)}}
function fire(k){const mr=myR();
  if(k==='spark')return startSpark();
  if(k==='prank'){if(!others()[0]){toast('Your partner has to be here for a prank 😈');return}if(room)room.emit('emote',{k:'crk',c:'prank',role:mr,name:myName||''}).catch(()=>{});toast('Fuse lit at their feet… 😈',2500);return}
  const d={k:'crk',c:k,x:+rnd(120,280).toFixed(0),role:mr,name:myName||''};doCracker(d);if(room)room.emit('emote',d).catch(()=>{})}
const crkb=document.createElement('button');crkb.className='em';crkb.id='crkb';crkb.innerHTML='<span>🧨</span>Crackers';$('#bar').insertBefore(crkb,$('#finale'));crkb.onclick=()=>{ac();sfx.tap();openCrackers()};

/* far-off strings of crackers somewhere in the neighbourhood */
setInterval(()=>{if(!soundOn||!AC||document.hidden||Math.random()>.25)return;const n=6+Math.floor(rnd(0,10));for(let i=0;i<n;i++)noise(.05,.05,2500+rnd(0,2500),i*.07)},9000);

/* ---------- audio v2: shared mix bus with reverb, layered sound effects, a festive procedural BGM ---------- */
let BUS=null,prevProg=-1,streakN=0,streakT=0;
const mf=m=>440*Math.pow(2,(m-69)/12);
function bus(){const c=ac();if(!c)return null;if(BUS&&BUS.c===c)return BUS;
  const inG=c.createGain(),comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=20;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.22;
  const master=c.createGain();master.gain.value=.95;inG.connect(comp);comp.connect(master);master.connect(c.destination);
  const conv=c.createConvolver(),len=Math.floor(c.sampleRate*2),buf=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}conv.buffer=buf;
  const rs=c.createGain(),wet=c.createGain();wet.gain.value=.5;rs.connect(conv);conv.connect(wet);wet.connect(comp);
  const duck=c.createGain(),mel=c.createGain(),rhy=c.createGain(),melSend=c.createGain(),sfxSend=c.createGain();melSend.gain.value=.35;sfxSend.gain.value=.22;
  mel.connect(duck);duck.connect(inG);mel.connect(melSend);melSend.connect(rs);rhy.connect(inG);sfxSend.connect(rs);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  BUS={c,inG,comp,master,rs,duck,mel,rhy,nb,sfxSend};return BUS}

tone=function(f,d=.15,type='sine',g=.12,to=null,at=0,dest){if(!soundOn)return;const c=ac();if(!c)return;const B=bus(),t=c.currentTime+at,o=c.createOscillator(),v=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(Math.max(.0002,g),t+.008);v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(v);v.connect(dest||B.inG);v.connect(B.sfxSend);o.start(t);o.stop(t+d+.03)};
noise=function(d=.2,g=.1,f=1200,at=0,type='bandpass',dest){if(!soundOn)return;const c=ac();if(!c)return;const B=bus(),t=c.currentTime+at,s=c.createBufferSource();
  s.buffer=B.nb;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;if(type==='bandpass')fl.Q.value=.9;
  const v=c.createGain();v.gain.setValueAtTime(Math.max(.0002,g),t);v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(fl);fl.connect(v);v.connect(dest||B.inG);v.connect(B.sfxSend);s.start(t,Math.random()*.8);s.stop(t+d+.03)};
function sweep(f0,f1,d,g,at=0){if(!soundOn)return;const c=ac();if(!c)return;const B=bus(),t=c.currentTime+at,s=c.createBufferSource();s.buffer=B.nb;s.loop=true;
  const fl=c.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.4;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
  const v=c.createGain();v.gain.setValueAtTime(0.0001,t);v.gain.linearRampToValueAtTime(g,t+d*.4);v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(fl);fl.connect(v);v.connect(B.inG);v.connect(B.sfxSend);s.start(t,Math.random()*.8);s.stop(t+d+.03)}
const bell=(f,at=0,dur=.9,g=.09)=>{tone(f,dur,'sine',g,null,at);tone(f*2.01,dur*.6,'sine',g*.4,null,at);tone(f*3.98,dur*.3,'sine',g*.14,null,at)};

Object.assign(sfx,{
  tap(){tone(1300,.03,'triangle',.07,650);tone(230,.07,'sine',.12,150)},
  pop(){tone(420,.12,'sine',.15,1100);tone(1500,.05,'sine',.04,2600,.03)},
  tick(i=0){const f=PENT[i%7]*Math.pow(2,Math.min(2,Math.floor(i/7))*.5);bell(f,0,.22,.05)},
  thud(){tone(120,.3,'sine',.4,38);noise(.1,.2,300,0,'lowpass');shake()},
  swish(){sweep(700,4200,.35,.12)},
  water(){for(let i=0;i<5;i++)tone(rnd(480,800),.1,'sine',.06,rnd(900,1500),i*.06)},
  chime(){[0,2,4,6].forEach((n,i)=>bell(PENT[n],i*.08,.9,.08));noise(.5,.03,9000,.05,'highpass')},
  tada(){[0,2,4].forEach(n=>bell(PENT[n]/2,0,1.1,.07));[0,2,4,6,5,6].forEach((n,i)=>bell(PENT[n]*(i>3?2:1),.1+i*.09,.8,.06));sweep(400,6000,.5,.07);noise(.9,.04,10000,.5,'highpass')},
  snap(){tone(900,.05,'square',.06,260);noise(.05,.12,3500)},
  boom(){tone(95,.7,'sine',.55,26);noise(.7,.32,420,0,'lowpass');for(let i=0;i<8;i++)noise(.03,.1,3000+rnd(0,3000),.15+i*rnd(.04,.12),'highpass')},
  love(){tone(587,.4,'sine',.1,880);tone(880,.5,'triangle',.06,1175,.1);bell(1175,.2,.7,.04)},
  lightup(i=0){const f=PENT[i%7]*(1+Math.floor(i/7));bell(f,0,.4,.05)}
});

/* the track: a warm, bouncy festive groove (Am F C G) that gets bigger as the home fills up */
const CHP=[{r:45,t:[57,60,64]},{r:41,t:[53,57,60]},{r:48,t:[60,64,67]},{r:43,t:[55,59,62]}];
const LEAD=[[76,0,0,72,0,76,0,0,79,0,76,0,72,0,0,0],[77,0,0,72,0,77,0,0,81,0,77,0,72,0,0,0],[76,0,0,79,0,84,0,0,79,0,76,0,72,0,0,0],[74,0,0,79,0,74,0,0,83,0,79,0,74,0,0,0]];
const ARPP=[0,1,2,1,3,2,1,2,0,1,2,3,4,3,2,1];
const TAB=['dha',0,0,'na',0,0,'tin',0,'dha',0,'na','na',0,0,'tin','na'];
Object.assign(music,{on:false,timer:0,step:0,nextT:0,ints:.28,tgt:.28,bpm:96,tbpm:96,
  start(){if(this.on||!soundOn)return;const c=ac();if(!c)return;bus();this.on=true;this.step=0;this.nextT=c.currentTime+.15;this.timer=setInterval(()=>this.sched(),30)},
  stop(){this.on=false;clearInterval(this.timer)},
  retarget(){const B=bus();if(!B)return;const m=cleaning?'clean':(endingOn||dancing||handsOn||sparking)?'party':'home',prog=Math.min(1,stepsDone()/TOTAL_STEPS);
    this.tgt=m==='clean'?.28:m==='party'?1:.32+prog*.5;this.tbpm=m==='clean'?92:m==='party'?108:100;
    this.ints+=(this.tgt-this.ints)*.6;this.bpm+=(this.tbpm-this.bpm)*.6;
    const t=AC.currentTime;B.mel.gain.setTargetAtTime(m==='clean'?.6:.9,t,.5);B.rhy.gain.setTargetAtTime(m==='clean'?.7:.95,t,.5)},
  sched(){if(!this.on||!AC)return;const c=AC;if(document.hidden){this.nextT=c.currentTime+.1;return}
    if(c.currentTime>this.nextT+1)this.nextT=c.currentTime+.05;
    while(this.nextT<c.currentTime+.18){this.play(this.step,this.nextT);this.nextT+=60/this.bpm/4;this.step=(this.step+1)%64}},
  play(step,t){const c=AC,B=bus();if(!B||!soundOn)return;const bar=Math.floor(step/16)%4,s=step%16,ch=CHP[bar],I=this.ints,spb=60/this.bpm/4,now=c.currentTime,rel=t-now;
    if(s===0)this.retarget();
    const mel=(type,f,at,dur,g,fc,att)=>{const o=c.createOscillator(),v=c.createGain(),fl=c.createBiquadFilter();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.setValueAtTime(fc,at);fl.frequency.exponentialRampToValueAtTime(Math.max(300,fc*.35),at+dur);
      v.gain.setValueAtTime(0.0001,at);v.gain.linearRampToValueAtTime(g,at+(att||.01));v.gain.exponentialRampToValueAtTime(0.0001,at+dur);o.connect(fl);fl.connect(v);v.connect(B.mel);o.start(at);o.stop(at+dur+.05)};
    const rh=(type,f0,f1,at,dur,g)=>{const o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,at);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),at+dur);v.gain.setValueAtTime(g,at);v.gain.exponentialRampToValueAtTime(0.0001,at+dur);o.connect(v);v.connect(B.rhy);o.start(at);o.stop(at+dur+.03)};
    if(s===0)ch.t.forEach(m=>{mel('sawtooth',mf(m-12),t,spb*16,.016,1100,.5);mel('triangle',mf(m),t,spb*16,.02,1500,.45)});
    const tones=[...ch.t,ch.t[0]+12,ch.t[1]+12];
    if(I>.2&&(I>.55||s%2===0)){const m=tones[ARPP[s]]+12;mel('triangle',mf(m),t,.3,.05*(.5+I*.5),3200,.003);mel('square',mf(m),t,.1,.011,2400,.002)}
    if(I>.45&&LEAD[bar][s]){const f=mf(LEAD[bar][s]);mel('triangle',f,t,.55,.05,2600,.02);mel('sine',f*2,t,.4,.012,3000,.02)}
    if(I>.3&&[0,3,6,8,11,14].includes(s)){rh('sine',mf(ch.r),mf(ch.r)*.98,t,.26,.2);rh('triangle',mf(ch.r+12),mf(ch.r+12),t,.12,.04)}
    if(I>.45&&(s===0||s===8||(I>.8&&(s===4||s===12)))){rh('sine',150,42,t,.22,.55);B.duck.gain.cancelScheduledValues(t);B.duck.gain.setValueAtTime(.4,t);B.duck.gain.linearRampToValueAtTime(1,t+.28);
      if(!reduce)setTimeout(()=>{const e=document.getElementById('beatglow');if(e){e.style.animation='none';void e.offsetWidth;e.style.animation='bgp .45s ease-out'}},Math.max(0,rel*1000))}
    if(I>.55&&(s===4||s===12))noise(.14,.2,1700,rel,'bandpass',B.rhy);
    if(I>.4&&s%2===0)noise(.04,s%4===2?.07:.04,9500,rel,'highpass',B.rhy);
    if(I>.2&&I<.6&&s%2===1)noise(.03,.025,7000,rel,'highpass',B.rhy);
    if(I>.35){const h=TAB[s];if(h==='dha'){rh('sine',150,95,t,.2,.2);noise(.05,.08,800,rel,'bandpass',B.rhy)}else if(h==='na')rh('sine',1000,900,t,.05,.07);else if(h==='tin')rh('sine',700,600,t,.08,.06)}
    if(bar===3&&I>.7&&s>=12)noise(.08,.1+(s-12)*.03,2200,rel,'bandpass',B.rhy)}
});

/* game feel: streaks while scrubbing, sparkles under every tap */
function streakHit(n,p){streakN+=n;clearTimeout(streakT);streakT=setTimeout(()=>{streakN=0},900);
  if(Math.floor(streakN/40)>Math.floor((streakN-n)/40)){const k=Math.floor(streakN/40);bell(PENT[k%7]*2,0,.5,.05);floatText(p.x,p.y-26,pick(['nice!','smooth','sparkly ✨','so clean','mmm','shiny!']),'#fff');burst(p.x,p.y,{n:10,sp:4,up:true,colors:['#fff','#ffe9a8','#bfe6ff']});buzz(12)}}
addEventListener('pointerdown',e=>{if(cleaning||sparking||!e.isPrimary)return;const sr=$('#stage').getBoundingClientRect();burst(e.clientX-sr.left,e.clientY-sr.top,{screen:true,n:5,sp:3,g:.05,colors:['#fff','#ffe9a8','#ffc2dc'],size:.8})},true);

buildScene();buildActors();buildBokeh();sizeFx();setCam(homeCam());applySky(0);afterState();
if(!me)$('#welcome').classList.add('show');
initNet().then(()=>{onPeers();if(me&&!isCleaned()&&!$('#welcome').classList.contains('show'))setTimeout(startClean,900)});
window.__olh={state:()=>state,TASKS,openTask,commit};
})();
